# The merge gate. Every pull request and every merge-queue entry runs the tests, and the single job below is named
# `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require
# (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# `gate` also waits for `changeset`, the shared check that a pull request changing a releasable path carries a changeset or a
# `no-release:` line (a11ign/a11ign#4127, the class fix of #4084; adopted here by #4133). Without one the merge releases nothing.
#
# Ubuntu only, on purpose: reading a PDF's tag tree needs no browser, no screen reader and no fleet. The last step packs
# the package and runs it from a tarball outside the repository, because a package that works in the workspace and
# fails when installed is the failure a first publish cannot take back.
name: ci

on:
  # `edited` because the changeset check reads the pull request's BODY: adding its `no-release:` line is an edit, and a run that did not
  # repeat would leave the check red on a body that is now right. The concurrency group below cancels the run an edit interrupts.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A releasable change needs a changeset or a `no-release:` line. `releasable-paths` is this repository's `dora` entry's `releasablePaths` in
  # a11ign/a11ign `.agent-org/project.json`, character for character: a path that matches nothing passes every pull request. THAT ENTRY STILL SAYS
  # `packages/pdf/` until the next row (the row after a11ign/a11ign#4212, which flattened this repository) moves it to `src/`. The sha is the merge
  # commit of a11ign/toolchain#15, and Dependabot's `github-actions` entry moves it. On a merge-group entry the called job succeeds without
  # evaluating, because the pull request's own run already decided.
  changeset:
    # A called workflow cannot hold more than its caller gives: with `contents: read` alone GitHub refuses the whole run at startup.
    permissions:
      contents: read
      pull-requests: read
    uses: a11ign/toolchain/.github/workflows/changeset-required.yml@eb23973525fd24c019abd8e424f11d4db7310ef1
    with:
      releasable-paths: src/

  # A PULL REQUEST THAT CHANGES HOW THIS TREE INSTALLS DRY-RUNS THE RELEASE'S VERSION STEP (a11ign/a11ign#5065; chairman, a11ign/agent-org#885 class 3 and
  # a11ign/a11ign#4988; the job is a11ign/agent-org#967's). Nothing else in this file runs the path the release takes: `gate` installs and tests, and a lockfile that
  # `pnpm install --frozen-lockfile` refuses after `changeset version` would reach `main` as a failed release, with nobody typing and no pull request to see it on.
  # The commands are the three that `release-per-merge.yml`'s `version` job runs for a repository with a lockfile, in a scratch clone, writing nothing:
  # `contents: read`, no credential kept by the checkout, no push, no token.
  #
  # IT RUNS ON EVERY EVENT AND DOES ITS WORK ONLY WHEN THE CHANGE TOUCHES `package.json`, `pnpm-lock.yaml`, `.npmrc` OR `.github/workflows/`. GitHub filters `paths:` per
  # WORKFLOW and not per job, and a workflow-wide filter would skip `gate` with it, so the job reads the paths itself and the steps after `touched` are conditional on it:
  # an untouched change is a `success` here, never a skip, and `gate` accepts `success` alone. The paths are judged against the first parent of the checked-out commit:
  # the merge ref of a pull request or a merge-queue entry.
  #
  # THE TOOLS ARE THIS REPOSITORY'S RELEASE, NOT ANOTHER'S: `release.yml` sets no `pnpm-version`, `node-version` or `changesets-version`, so pnpm is `packageManager`'s
  # (`pnpm/action-setup` reads it, as `gate` does), Node is `22` (the called workflow's default) and `changeset` is the lockfile's own `@changesets/cli`.
  # No consumer-install step follows: `agent-org-newest-tag` installs a tag of agent-org, and this package is installed from the npm registry (`kind: npm`), which
  # `pnpm run smoke` in `gate` already exercises from the packed tarball. It versions EVERY changeset in the tree, where the release versions only those no tag has
  # consumed: a superset, so a failure the release would meet is met here.
  #
  # THE CHECKOUT AND THE VERSION STEP'S CLONE ARE FULL-DEPTH (ceo review of documents#14: the same job hung 29 minutes in agent-org#967). `changeset version` reads git
  # history and DEEPENS a shallow clone, and on a `--depth=1` one it spins; a `fetch-depth: 2` checkout cloned with `--depth=1` is that case.
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The WHOLE history, not two commits: `touched` needs only HEAD and its first parent, but the version step clones this checkout and `changeset version`
          # deepens a shallow clone and hangs (see the job's header). No credential is kept: nothing here pushes.
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch what the release installs from?
        id: touched
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "changed paths:"
          echo "$changed"
          if grep -q -E '^(package\.json|pnpm-lock\.yaml|\.npmrc)$|^\.github/workflows/' <<<"$changed"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "no install-affecting path changed: the release dry run is not needed"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.touched.outputs.touched == 'true'
      - uses: actions/setup-node@v7
        if: steps.touched.outputs.touched == 'true'
        with:
          node-version: 22
      - name: The release's version step, dry-run on a scratch clone -- install, changeset version, lockfile refresh
        if: steps.touched.outputs.touched == 'true'
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/release-dry-run"
          git clone --quiet "file://$GITHUB_WORKSPACE" "$scratch"
          cd "$scratch"
          pnpm install --frozen-lockfile
          pnpm exec changeset version
          pnpm install --lockfile-only

  # THE REQUIRED CHECK. `if: always()` because a job whose need failed is SKIPPED, and a skipped required check counts as passed; the last step
  # accepts `success` ONLY, since `changeset` succeeds on a merge-group entry rather than skipping, so anything else means it did not run.
  gate:
    needs: [changeset, release-dry-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm`
      # shells out to it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run smoke
      # The shared layout check (a11ign/toolchain, ADR 0043; a11ign/a11ign#4210): a single-package repository keeps its package at the root. It runs
      # the installed copy by path because the published `layout-check` bin has no shebang, so `npx … layout-check` is executed by `sh` and fails.
      - run: pnpm run layout-check
      # Last and unconditional, so a red `changeset` or `release-dry-run` does not hide a red test, nor the reverse.
      # `release-dry-run` is read the same way and for the same reason: it succeeds on an untouched change rather than skipping, so anything but `success`
      # means the release's version step failed, or did not run.
      - name: The changeset check and the release dry run ran, and ran clean
        if: always() && !cancelled()
        env:
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          RELEASE_DRY_RUN_RESULT: ${{ needs.release-dry-run.result }}
        run: |
          for result in "changeset=$CHANGESET_RESULT" "release-dry-run=$RELEASE_DRY_RUN_RESULT"; do
            if [ "${result#*=}" != "success" ]; then
              echo "::error::the ${result%%=*} job reported '${result#*=}', not success"
              exit 1
            fi
          done
